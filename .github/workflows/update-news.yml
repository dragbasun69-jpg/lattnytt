name: Uppdatera nyheter

on:
  schedule:
    - cron: "17 * * * *"   # varje timme, 17 minuter över (UTC)
  workflow_dispatch:        # gör att du kan köra den manuellt under fliken Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hämta nyheter
        run: node scripts/fetch-news.mjs
        continue-on-error: true   # sajten publiceras ändå med förra nyheterna

      - name: Spara nyheterna i repot om något ändrats
        run: |
          git config user.name "nyhetsroboten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Inga nya nyheter."
          else
            git commit -m "Nya nyheter $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Packa sajten
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
